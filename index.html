
<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174D38">
  <title>Familiens affaldskalender</title>

  <style>
    :root {
      --green: #174D38;
      --light-green: #28674D;
      --muted: #C4E1D0;
      --white: #FFFFFF;
      --line: rgba(255,255,255,.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 22px;
      background: var(--green);
      color: var(--white);
      font-family: system-ui, -apple-system,
                   BlinkMacSystemFont, "Segoe UI",
                   sans-serif;
    }

    .card {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 34px;
    }

    .heading {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .heading svg {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 750;
      letter-spacing: -.5px;
    }

    .expand {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: white;
      cursor: pointer;
    }

    .expand:hover {
      background: rgba(255,255,255,.1);
    }

    .expand svg {
      width: 23px;
      height: 23px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 1.4px;
      margin-bottom: 16px;
    }

    .next {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .date-box {
      flex-shrink: 0;
      min-width: 100px;
      padding: 16px 12px;
      border-radius: 15px;
      background: var(--light-green);
      text-align: center;
    }

    .day {
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
    }

    .month {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 750;
      text-transform: uppercase;
    }

    .type {
      font-size: 21px;
      font-weight: 750;
      line-height: 1.3;
    }

    .weekday {
      margin-top: 7px;
      color: var(--muted);
      font-size: 15px;
    }

    .relative {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,.13);
      color: white;
      font-size: 12px;
      font-weight: 750;
    }

    .relative:empty {
      display: none;
    }

    .divider {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 0 0 28px;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0;
      font-size: 15px;
    }

    .item + .item {
      border-top: 1px solid var(--line);
    }

    .item-date {
      font-weight: 600;
    }

    .item-type {
      text-align: right;
    }

    .status {
      color: var(--muted);
      font-size: 15px;
      padding: 16px 0;
    }

    .hidden {
      display: none !important;
    }

    .full .card {
      max-width: 900px;
    }

    .full .header {
      margin-bottom: 45px;
    }

    .full .item {
      padding: 20px 0;
    }

    .full-label {
      display: none;
      color: var(--muted);
      font-size: 13px;
      margin: -12px 0 26px;
    }

    .full .full-label {
      display: block;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;
      }

      .header {
        margin-bottom: 28px;
      }

      h1 {
        font-size: 20px;
      }

      .heading {
        gap: 10px;
      }

      .heading svg {
        width: 26px;
        height: 26px;
      }

      .next {
        gap: 15px;
      }

      .date-box {
        min-width: 84px;
        padding: 13px 10px;
      }

      .day {
        font-size: 36px;
      }

      .type {
        font-size: 18px;
      }

      .item {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <header class="header">
      <div class="heading">

        <!-- Skraldespand med låg og hjul -->
        <svg
          viewBox="0 0 48 48"
          fill="none"
          stroke="currentColor"
          stroke-width="2.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M13 13h22l-2 27H15L13 13Z"/>
          <path d="M10 13h28"/>
          <path d="M17 13V8h14v5"/>
          <path d="M19 8V5h10v3"/>
          <path d="M21 19v14"/>
          <path d="M27 19v14"/>
          <circle cx="18" cy="43" r="2"/>
          <circle cx="30" cy="43" r="2"/>
        </svg>

        <h1>AFFALD</h1>
      </div>

      <button
        class="expand"
        id="expand"
        type="button"
        aria-label="Vis alle tømningsdatoer"
        aria-expanded="false"
        title="Udvid oversigt"
      >
        <svg
          id="expand-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
          <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
          <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
          <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
        </svg>
      </button>
    </header>

    <div id="loading" class="status">
      Henter tømningsdatoer...
    </div>

    <section id="content" class="hidden">

      <div class="eyebrow">NÆSTE TØMNING</div>

      <div class="next">
        <div class="date-box">
          <div class="day" id="next-day"></div>
          <div class="month" id="next-month"></div>
        </div>

        <div>
          <div class="type" id="next-type"></div>
          <div class="weekday" id="next-weekday"></div>
          <div class="relative" id="next-relative"></div>
        </div>
      </div>

      <hr class="divider">

      <div class="eyebrow">DEREFTER</div>
      <p class="full-label">
        Alle tilgængelige kommende tømningsdatoer
      </p>

      <div id="upcoming"></div>
    </section>
  </main>

  <script>
    const SUPABASE_URL =
      "https://kxopqitccnoycjwpibuj.supabase.co";

    // Indsæt din offentlige publishable-nøgle her.
    // Brug ALDRIG service_role eller en secret key.
    const SUPABASE_KEY = "sb_publishable_J6Ez04iYCczh_FW8OOQnig_3zcGxeaI";

    const tableUrl =
      SUPABASE_URL +
      "/rest/v1/affald_toemninger" +
      "?select=dato,affaldstype&order=dato.asc";

    let collections = [];
    let expanded = false;

    const $ = id => document.getElementById(id);

    function todayInDenmark() {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Copenhagen",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

      const get = name =>
        parts.find(part => part.type === name).value;

      return `${get("year")}-${get("month")}-${get("day")}`;
    }

    function formatType(type) {
      if (type.includes("Plast/MDK")) {
        return "Glas/papir/plast";
      }

      if (type.includes("Mad-/Rest")) {
        return "Mad- og restaffald";
      }

      return type;
    }

    function parseDate(iso) {
      return new Date(iso + "T12:00:00Z");
    }

    function formatDate(iso) {
      return new Intl.DateTimeFormat("da-DK", {
        timeZone: "Europe/Copenhagen",
        day: "numeric",
        month: "long"
      }).format(parseDate(iso));
    }

    function formatMonth(iso) {
      return new Intl.DateTimeFormat("da-DK", {
        timeZone: "Europe/Copenhagen",
        month: "long"
      }).format(parseDate(iso));
    }

    function formatWeekday(iso) {
      return new Intl.DateTimeFormat("da-DK", {
        timeZone: "Europe/Copenhagen",
        weekday: "long"
      }).format(parseDate(iso));
    }

    function daysUntil(iso) {
      const today = todayInDenmark();

      const start = Date.parse(today + "T12:00:00Z");
      const end = Date.parse(iso + "T12:00:00Z");

      return Math.round((end - start) / 86400000);
    }

    function relativeLabel(iso) {
      const days = daysUntil(iso);

      if (days === 0) return "I dag";
      if (days === 1) return "I morgen";
      if (days === 2) return "Om 2 dage";

      return "";
    }

    function showError(message) {
      $("loading").textContent = message;
      $("loading").classList.remove("hidden");
      $("content").classList.add("hidden");
    }

    function render() {
      const today = todayInDenmark();

      const upcoming = collections.filter(
        row => row.dato >= today
      );

      if (!upcoming.length) {
        showError(
          "Ingen kommende tømningsdatoer er offentliggjort."
        );
        return;
      }

      const next = upcoming[0];

      $("next-day").textContent =
        Number(next.dato.slice(8, 10));

      $("next-month").textContent =
        formatMonth(next.dato);

      $("next-type").textContent =
        formatType(next.affaldstype);

      $("next-weekday").textContent =
        formatWeekday(next.dato);

      $("next-relative").textContent =
        relativeLabel(next.dato);

      const container = $("upcoming");
      container.replaceChildren();

      const remaining = upcoming.slice(1);
      const visible = expanded
        ? remaining
        : remaining.slice(0, 3);

      visible.forEach(item => {
        const row = document.createElement("div");
        row.className = "item";

        const date = document.createElement("span");
        date.className = "item-date";
        date.textContent = formatDate(item.dato);

        const type = document.createElement("span");
        type.className = "item-type";
        type.textContent = formatType(item.affaldstype);

        row.append(date, type);
        container.appendChild(row);
      });

      if (remaining.length === 0) {
        const empty = document.createElement("div");
        empty.className = "status";
        empty.textContent =
          "Ingen yderligere datoer er tilgængelige.";
        container.appendChild(empty);
      }

      $("loading").classList.add("hidden");
      $("content").classList.remove("hidden");
    }

    function toggleExpanded() {
      expanded = !expanded;

      document.body.classList.toggle("full", expanded);

      $("expand").setAttribute(
        "aria-expanded",
        String(expanded)
      );

      $("expand").setAttribute(
        "aria-label",
        expanded
          ? "Vis kompakt oversigt"
          : "Vis alle tømningsdatoer"
      );

      $("expand").title = expanded
        ? "Vis kompakt oversigt"
        : "Udvid oversigt";

      // Skift mellem udvid- og formindsk-ikon.
      $("expand-icon").innerHTML = expanded
        ? '<path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/>'
        : '<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/>';

      render();
    }

    async function loadCollections() {
      try {
        const response = await fetch(tableUrl, {
          headers: {
            apikey: SUPABASE_KEY
          },
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const rows = await response.json();

        if (!Array.isArray(rows)) {
          throw new Error("Uventet svar fra Supabase");
        }

        collections = rows
          .filter(row =>
            typeof row.dato === "string" &&
            typeof row.affaldstype === "string"
          )
          .sort((a, b) => a.dato.localeCompare(b.dato));

        render();

      } catch (error) {
        console.error("Fejl ved hentning:", error);
        showError("Kunne ikke hente tømningsdatoerne.");
      }
    }

    $("expand").addEventListener("click", toggleExpanded);

    loadCollections();

    // Opdater datoangivelserne, når fanen aktiveres igen.
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        loadCollections();
      }
    });
  </script>
</body>
</html>
